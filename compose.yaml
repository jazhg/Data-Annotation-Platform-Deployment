services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-annotation_platform}
      POSTGRES_USER: ${POSTGRES_USER:-annotation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-annotation_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - annotation_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  annotation_postgres_data:
