<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Annotation Platform - Create account</title>
</head>
<body>
    <h1>Create an account</h1>
    <p>Use your email address and choose a password. Enter the access code provided by your researcher.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
</body>
</html>
