{% extends 'registration/password_reset_base.html' %}
{% block content %}
{% if validlink %}
<h1>Choose a new password</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Reset password</button></form>
{% else %}
<h1>Invalid or expired link</h1>
<p>This link is no longer valid. <a href="{% url 'password_reset' %}">Request another reset link</a>.</p>
{% endif %}
{% endblock %}
